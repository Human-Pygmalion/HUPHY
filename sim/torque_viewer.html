<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torque Viewer</title>
<!--
  sim/rollout.py --log 이 남긴 JSON 에서 **토크만** 봄. 외부 라이브러리 없음.

  이 열은 시뮬 기록에만 있음 (`telemetry/policy_log.py` 의 torque_source):

      tau/<관절>      그 주기에서 가장 셌던 토크 (Nm, 부호 있음)
      tau_lim/<관절>  그 스텝에 걸려 있던 상한 (Nm, 토크와 같은 부호)
      tau_sat/<관절>  상한에 잘린 물리 스텝의 비율 (0~1)

  상한을 같이 보는 이유: 자른 뒤 값만 보면 천장에 붙은 것인지 그만큼만 필요했던
  것인지 구분이 안 됨. 상한은 속도에 따라 움직임 -- 빨리 돌면 낮아짐
  (`sim/huphy_sim/actuator.py` 의 토크-속도 곡선).

  `tools/policy_viewer.html` 을 쓰지 않는 이유: 그쪽은 목표/실측 추종을 재생하듯
  보는 것이고, 여기는 토크 한 가지를 열두 칸에 늘어놓고 보는 것임.
-->
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #1d2330; --muted: #6b7385; --line: #e2e5eb;
  --grid: #eef0f4; --accent: #2f6fed; --limit: #6b7385; --sat: #e0343433; --chip: #eef2fb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1a1e26; --fg: #e4e7ee; --muted: #8a93a6; --line: #2a303c;
    --grid: #232833; --accent: #6b9bff; --limit: #8a93a6; --sat: #ff6b6b33; --chip: #232a38;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1a1e26; --fg: #e4e7ee; --muted: #8a93a6; --line: #2a303c;
  --grid: #232833; --accent: #6b9bff; --limit: #8a93a6; --sat: #ff6b6b33; --chip: #232a38;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg);
  font: 13px/1.4 system-ui, -apple-system, "Noto Sans KR", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
.meta { color: var(--muted); }
button { font: inherit; color: var(--fg); background: var(--chip);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
label.row { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 10px; padding: 12px 16px; }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 8px 4px; }
.chart .title { display: flex; justify-content: space-between; gap: 8px; font-size: 12px;
  color: var(--muted); padding: 0 2px 2px; }
.chart .title b { color: var(--fg); font-weight: 600; }
.chart .title span { font-variant-numeric: tabular-nums; }
.chart.hot { outline: 1px solid var(--accent); }
canvas { width: 100%; height: 150px; display: block; cursor: crosshair; }
#drop { margin: 40px auto; max-width: 560px; text-align: center; padding: 48px 24px;
  border: 2px dashed var(--line); border-radius: 12px; color: var(--muted); }
#drop.hover { border-color: var(--accent); color: var(--fg); }
#legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px;
  padding: 0 16px 8px; }
#legend i { display: inline-block; width: 18px; height: 0; vertical-align: middle;
  border-top: 2px solid var(--accent); margin-right: 4px; }
#legend i.lim { border-top: 2px dashed var(--limit); }
#legend i.sat { height: 10px; border: 0; background: var(--sat); vertical-align: -2px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>토크 뷰어</h1>
  <button id="open">파일 열기</button>
  <input id="file" type="file" accept=".json" class="hidden">
  <label class="row" title="모든 칸의 y 축을 가장 큰 값에 맞춤. 끄면 칸마다 따로"><input type="checkbox" id="share"> y 축 공유</label>
  <label class="row" title="상한선과 그 바깥을 가림"><input type="checkbox" id="showlim" checked> 상한</label>
  <span class="meta" id="meta">sim/rollout.py --log 이 남긴 JSON</span>
</header>

<div id="legend" class="hidden">
  <span><i></i>토크</span>
  <span><i class="lim"></i>그 속도에서의 상한</span>
  <span><i class="sat"></i>상한에 잘린 구간</span>
  <span id="cursor"></span>
</div>

<div id="drop">JSON 파일을 여기로 끌어다 놓거나 <b>파일 열기</b>를 누르세요.</div>
<section class="charts hidden" id="charts"></section>

<script>
"use strict";
const PAD = { l: 48, r: 6, t: 4, b: 20 };
const S = { joints: [], t: null, n: 0, tau: {}, lim: {}, sat: {}, charts: [], at: -1 };
const $ = (id) => document.getElementById(id);
const short = (j) => j.replace("right_leg/", "R ").replace("left_leg/", "L ");

// ---- 읽기 ---------------------------------------------------------------
// 파일 한 개 = {run, columns, rows}. rows 의 null 은 값이 없던 자리 -> NaN.
// 첫 줄은 토크가 null 임 -- 물리가 한 주기도 안 굴러간 상태에서 모델이 먼저 불림.
function load(text, name) {
  const doc = JSON.parse(text);
  const cols = doc.columns || [], rows = doc.rows || [];
  if (!cols.length || !rows.length) throw new Error("columns/rows 가 비었음");

  const joints = cols.filter((c) => c.startsWith("tau/")).map((c) => c.slice(4));
  if (!joints.length) {
    throw new Error("tau/ 열이 없음 -- 토크를 남기는 것은 sim/rollout.py --log 뿐임");
  }

  const n = rows.length;
  const take = (col) => {
    const k = cols.indexOf(col);
    const out = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const v = k < 0 ? null : rows[i][k];
      out[i] = v === null || v === undefined ? NaN : +v;
    }
    return out;
  };

  Object.assign(S, {
    joints, n, t: take("t"), at: -1,
    tau: Object.fromEntries(joints.map((j) => [j, take("tau/" + j)])),
    lim: Object.fromEntries(joints.map((j) => [j, take("tau_lim/" + j)])),
    sat: Object.fromEntries(joints.map((j) => [j, take("tau_sat/" + j)])),
  });

  const dur = S.t[n - 1] - S.t[0];
  const run = doc.run || {};
  const where = run.sim ? "시뮬" : "실물 기록으로 보임 -- 토크 열의 뜻이 다를 수 있음";
  $("meta").textContent =
    `${name} · ${where} · 관절 ${joints.length}개 · ${n}줄 · ${dur.toFixed(1)} s`;
  $("drop").classList.add("hidden");
  ["charts", "legend"].forEach((id) => $(id).classList.remove("hidden"));
  build();
}

// ---- 칸 만들기 -----------------------------------------------------------
function stats(j) {
  const tau = S.tau[j], sat = S.sat[j];
  let peak = 0, hot = 0, seen = 0;
  for (let i = 0; i < S.n; i++) {
    if (Number.isFinite(tau[i])) { peak = Math.max(peak, Math.abs(tau[i])); seen++; }
    if (sat[i] > 0) hot++;
  }
  return { peak, hot, seen };
}

function build() {
  const root = $("charts");
  root.innerHTML = "";
  S.charts = [];
  S.joints.forEach((j) => {
    const box = document.createElement("div");
    box.className = "chart";
    const st = stats(j);
    const note = st.hot
      ? `최대 ${st.peak.toFixed(1)} Nm · 포화 ${st.hot}줄`
      : `최대 ${st.peak.toFixed(1)} Nm`;
    box.innerHTML = `<div class="title"><b>${short(j)}</b><span>${note}</span></div>`;
    const canvas = document.createElement("canvas");
    box.appendChild(canvas);
    root.appendChild(box);
    const readout = box.querySelector("span");
    S.charts.push({ joint: j, box, canvas, readout, note, hot: st.hot });

    canvas.addEventListener("mousemove", (e) => {
      const r = canvas.getBoundingClientRect();
      const w = r.width - PAD.l - PAD.r;
      const f = (e.clientX - r.left - PAD.l) / (w || 1);
      const i = Math.round(f * (S.n - 1));
      S.at = Math.min(S.n - 1, Math.max(0, i));
      render();
    });
    canvas.addEventListener("mouseleave", () => { S.at = -1; render(); });
  });
  render();
}

// ---- 그리기 ---------------------------------------------------------------
function span() {
  if (!$("share").checked) return null;
  let hi = 0;
  const withLim = $("showlim").checked;
  for (const j of S.joints) {
    const tau = S.tau[j], lim = S.lim[j];
    for (let i = 0; i < S.n; i++) {
      if (Number.isFinite(tau[i])) hi = Math.max(hi, Math.abs(tau[i]));
      if (withLim && Number.isFinite(lim[i])) hi = Math.max(hi, Math.abs(lim[i]));
    }
  }
  return hi;
}

function render() {
  if (!S.n) return;
  const css = getComputedStyle(document.documentElement);
  const C = (v) => css.getPropertyValue(v).trim();
  const shared = span();
  S.charts.forEach((ch) => draw(ch, C, shared));

  const at = S.at;
  $("cursor").textContent = at < 0 ? "" : `t = ${(S.t[at] - S.t[0]).toFixed(2)} s`;
  S.charts.forEach((ch) => {
    if (at < 0) { ch.readout.textContent = ch.note; ch.box.classList.remove("hot"); return; }
    const tau = S.tau[ch.joint][at], lim = S.lim[ch.joint][at], sat = S.sat[ch.joint][at];
    const parts = [`${Number.isFinite(tau) ? tau.toFixed(1) : "-"} Nm`];
    if ($("showlim").checked && Number.isFinite(lim)) parts.push(`한도 ${Math.abs(lim).toFixed(1)}`);
    if (sat > 0) parts.push(`포화 ${Math.round(sat * 100)}%`);
    ch.readout.textContent = parts.join(" · ");
    ch.box.classList.toggle("hot", sat > 0);
  });
}

function draw(ch, C, shared) {
  const cv = ch.canvas, dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  const tau = S.tau[ch.joint], lim = S.lim[ch.joint], sat = S.sat[ch.joint];
  const withLim = $("showlim").checked;
  let hi = shared;
  if (hi === null) {
    hi = 0;
    for (let i = 0; i < S.n; i++) {
      if (Number.isFinite(tau[i])) hi = Math.max(hi, Math.abs(tau[i]));
      if (withLim && Number.isFinite(lim[i])) hi = Math.max(hi, Math.abs(lim[i]));
    }
  }
  hi = hi > 0 ? hi * 1.1 : 1;

  const pw = W - PAD.l - PAD.r, ph = H - PAD.t - PAD.b;
  const X = (i) => PAD.l + (S.n < 2 ? 0 : (i / (S.n - 1)) * pw);
  const Y = (v) => PAD.t + ph / 2 - (v / hi) * (ph / 2);

  // 잘린 구간을 먼저 깔아 둠 -- 선 아래로 들어가야 선이 가려지지 않음
  g.fillStyle = C("--sat");
  for (let i = 0; i < S.n; i++) {
    if (!(sat[i] > 0)) continue;
    const a = X(i === 0 ? 0 : i - 0.5), b = X(i === S.n - 1 ? i : i + 0.5);
    g.fillRect(a, PAD.t, Math.max(b - a, 1), ph);
  }

  // 0 선과 y 눈금
  g.strokeStyle = C("--grid");
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(PAD.l, Y(0) + 0.5); g.lineTo(W - PAD.r, Y(0) + 0.5);
  g.stroke();
  g.fillStyle = C("--muted");
  g.font = "10px system-ui, sans-serif";
  g.textAlign = "right";
  g.fillText("0", PAD.l - 4, Y(0) + 3);
  const tick = hi / 1.1;
  g.fillText(`+${tick.toFixed(0)}`, PAD.l - 4, Y(tick) + 3);
  g.fillText(`-${tick.toFixed(0)}`, PAD.l - 4, Y(-tick) + 3);
  g.textAlign = "left";
  g.fillText(`${(S.t[S.n - 1] - S.t[0]).toFixed(1)} s`, PAD.l, H - 6);

  if (withLim) line(g, lim, X, Y, C("--limit"), true);
  line(g, tau, X, Y, C("--accent"), false);

  if (S.at >= 0) {
    g.strokeStyle = C("--accent");
    g.globalAlpha = 0.45;
    g.beginPath();
    g.moveTo(X(S.at) + 0.5, PAD.t); g.lineTo(X(S.at) + 0.5, PAD.t + ph);
    g.stroke();
    g.globalAlpha = 1;
  }
}

function line(g, data, X, Y, color, dash) {
  g.strokeStyle = color;
  g.lineWidth = dash ? 1 : 1.5;
  g.setLineDash(dash ? [4, 3] : []);
  g.beginPath();
  let down = true;
  for (let i = 0; i < S.n; i++) {
    const v = data[i];
    if (!Number.isFinite(v)) { down = true; continue; }   // 값이 없는 줄에서 끊음
    const x = X(i), y = Y(v);
    down ? g.moveTo(x, y) : g.lineTo(x, y);
    down = false;
  }
  g.stroke();
  g.setLineDash([]);
}

// ---- 파일 ---------------------------------------------------------------
function read(file) {
  const r = new FileReader();
  r.onload = () => {
    try { load(String(r.result), file.name); }
    catch (e) { $("meta").textContent = `읽기 실패: ${e.message}`; }
  };
  r.readAsText(file);
}

$("open").onclick = () => $("file").click();
$("file").onchange = (e) => { if (e.target.files[0]) read(e.target.files[0]); };
["share", "showlim"].forEach((id) => { $(id).onchange = render; });
window.addEventListener("resize", render);

const drop = $("drop");
["dragenter", "dragover"].forEach((t) => document.addEventListener(t, (e) => {
  e.preventDefault(); drop.classList.add("hover");
}));
["dragleave", "drop"].forEach((t) => document.addEventListener(t, (e) => {
  e.preventDefault(); drop.classList.remove("hover");
}));
document.addEventListener("drop", (e) => {
  const file = e.dataTransfer.files[0];
  if (file) read(file);
});
</script>
</body>
</html>
